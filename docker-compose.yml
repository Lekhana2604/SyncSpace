version: '3.8'

services:
  # 1. MySQL 8.0 Relational Database
  mysql:
    image: mysql:8.0
    container_name: syncspace-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: syncspace_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
      - syncspace-network

  # 2. Node.js / Express REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syncspace-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: syncspace_docker_secret_jwt_2026
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: syncspace_db
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    networks:
      - syncspace-network

  # 3. Hocuspocus WebSockets Collaboration Server
  collab-server:
    build:
      context: ./collaboration-server
      dockerfile: Dockerfile
    container_name: syncspace-collab
    restart: always
    environment:
      PORT: 1234
      JWT_SECRET: syncspace_docker_secret_jwt_2026
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: syncspace_db
    ports:
      - "1234:1234"
    depends_on:
      - mysql
    networks:
      - syncspace-network

  # 4. Vite React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syncspace-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
      - collab-server
    networks:
      - syncspace-network

volumes:
  mysql_data:

networks:
  syncspace-network:
    driver: bridge
